[project]
name = "mypackage"
version = "0.1.0"
description = "One sentence on what the package does."
readme = "README.md"
requires-python = ">= 3.12"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

# ── Pixi: environment and tasks ──────────────────────────────────────────────
# pixi reads its settings from this file. uv users can ignore this part:
# `uv sync` and `uv run pytest` work on the [project] table above.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.13.*"
# Quarto renders docs/ and runs the Python code in it.
quarto = ">=1.8"
ipykernel = "*"
nbformat = "*"
nbclient = "*"
pyyaml = "*"
matplotlib = "*"

[tool.pixi.pypi-dependencies]
mypackage = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks.test]
cmd = "pytest"
description = "Run the tests"

[tool.pixi.tasks.lint]
cmd = "ruff check . && ruff format --check ."
description = "Check for common mistakes and formatting"

[tool.pixi.tasks.format]
cmd = "ruff check --fix . && ruff format ."
description = "Fix what ruff can fix, and format the code"

[tool.pixi.tasks.typecheck]
cmd = "mypy"
description = "Check type annotations"

[tool.pixi.tasks.check]
depends-on = ["lint", "typecheck", "test"]
description = "Everything that must pass before a change is done"

[tool.pixi.tasks.docs]
cmd = "quarto render docs"
description = "Render docs/, running every validation document"

[tool.pixi.tasks.preview]
cmd = "quarto preview docs"
description = "Open a live preview of docs/ that updates on every save"

# Claude Code: group skills (github.com/tolborg-group/group-skills).
# Keep each cmd on one line: pixi's shell rejects a line starting with || or &&.
[tool.pixi.tasks.check-claude]
cmd = "claude --version > /dev/null || (echo \"Claude Code not found. Install it and run 'claude' once to log in.\" && exit 1)"
description = "Check that Claude Code is installed"

[tool.pixi.tasks.setup-claude]
depends-on = ["check-claude"]
cmd = "claude plugin marketplace add tolborg-group/group-skills && claude plugin install git@tolborg-group"
description = "Install the group's Claude Code plugins (run once)"

[tool.pixi.tasks.sync]
depends-on = ["check-claude"]
cmd = 'claude "/git:sync"'
description = "Start Claude Code to commit, pull and push this repo"

# ── Tool configuration ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import order, B: bugbear (likely bugs),
# UP: modern syntax, NPY: NumPy-specific rules.
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
files = ["src", "tests"]
strict = true
